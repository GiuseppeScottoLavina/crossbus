plugins { id 'com.android.application' }
android {
    namespace 'io.crossbus.qualification'
    compileSdk 35
    defaultConfig {
        applicationId 'io.crossbus.qualification'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    sourceSets.main.assets.srcDirs = ['../../fixtures', '../../../../dist']
}
dependencies {
    if (providers.gradleProperty('usePublishedBridge').orNull == 'true') {
        implementation 'io.github.giuseppescottolavina:crossbus-native:0.1.5-SNAPSHOT'
    } else {
        implementation project(':bridge')
    }
}
