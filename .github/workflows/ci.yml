name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Lint
      run: bun run lint

    - name: Type Check
      run: bun run typecheck

    - name: Build
      run: bun run build

    - name: Test packaged exports
      run: bun test tests/package/

    - name: Test opt-in RPC experiments
      run: bun test tests/experiments/

    - name: Test consumer declarations
      run: bun run test:types

    - name: Test TypeScript 5.9 consumer compatibility
      run: npx --yes --package typescript@5.9.3 tsc --project tests/package/tsconfig.json

    - name: Test with Coverage
      run: bun run test:coverage

    - name: Install Chrome for browser tests
      run: node_modules/.bin/browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer"

    - name: Test browser integrations
      run: bun run test:e2e && bun run test:integration && bun run test:docs

    - name: Qualify browser RPC and bounded streaming
      run: node tests/qualification/run-browser.js chrome

    - name: Verify retained performance evidence
      run: node experiments/next-release/report.js && node experiments/next-release/stream-report.js

    - name: Upload focused browser qualification
      uses: actions/upload-artifact@v4
      with:
        name: chrome-qualification
        path: artifacts/qualification-chrome.json

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Pack npm release candidate
      run: |
        mkdir -p artifacts
        npm pack --ignore-scripts --pack-destination artifacts

    - name: Upload npm release candidate
      uses: actions/upload-artifact@v4
      with:
        name: npm-package
        path: artifacts/*.tgz

  package-consumer:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Install packed package in an isolated consumer
        run: |
          mkdir -p "$RUNNER_TEMP/crossbus-consumer"
          cp tests/package/consumer-smoke.mjs "$RUNNER_TEMP/crossbus-consumer/check.mjs"
          PACKAGE_ARCHIVE="$(find "$GITHUB_WORKSPACE/artifacts" -name '*.tgz' -print -quit)"
          PACKAGE_VERSION="$(node -p 'require(process.env.GITHUB_WORKSPACE + "/package.json").version')"
          cd "$RUNNER_TEMP/crossbus-consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$PACKAGE_ARCHIVE"
          node check.mjs "$PACKAGE_VERSION"

  native-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift package for macOS
        run: swift build --scratch-path artifacts/swift-package
      - name: Type-check iOS adapter
        run: |
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc -typecheck -sdk "$SDK_PATH" -target arm64-apple-ios15.0-simulator native/ios/CrossBusBridge.swift

  native-android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Package Android SDK in local Maven repository
        run: native/android/gradlew -p native/android --no-daemon publishReleasePublicationToQualificationRepository
      - name: Verify AAR, source and license
        run: python3 tests/native/check-artifact.py artifacts/native-maven/io/github/giuseppescottolavina/crossbus-native/0.1.5-SNAPSHOT
      - name: Build isolated AAR consumer
        run: native/android/gradlew -p tests/native/android-host --no-daemon -PusePublishedBridge=true :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-sdk
          path: |
            artifacts/native-maven/**/*.aar
            artifacts/native-maven/**/*-sources.jar
            artifacts/native-maven/**/*.pom
